name: Release

# Run by hand (Actions > Release > Run workflow): builds the player zip and installer from main
# and publishes them as a GitHub release, creating the tag v<version>.
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version, for example 0.1.0-beta.1'
        required: true
      prerelease:
        description: 'Mark as pre-release'
        type: boolean
        default: true

permissions:
  contents: write

env:
  SIMHUB_VERSION: '9.13.2'

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Build and run validation tests
        shell: pwsh
        run: ./scripts/Test.ps1
      - name: Cache SimHub (build reference only, not packaged)
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/SimHub
          key: simhub-${{ env.SIMHUB_VERSION }}
      - name: Install SimHub for its plugin DLLs
        timeout-minutes: 15
        shell: pwsh
        run: ./scripts/Get-SimHubSdk.ps1 -Version $env:SIMHUB_VERSION -Destination "$env:RUNNER_TEMP/SimHub"
      - name: Install Inno Setup
        shell: pwsh
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) { choco install innosetup --no-progress -y }
      - name: Build download and installer
        shell: pwsh
        env:
          VERSION: ${{ inputs.version }}
        run: |
          if ($env:VERSION -notmatch '^\d+\.\d+\.\d+(-[0-9A-Za-z.]+)?$') { throw "Version must look like 0.1.0 or 0.1.0-beta.1" }
          ./scripts/Package.ps1 -SimHubPath "$env:RUNNER_TEMP/SimHub" -Version $env:VERSION
      - name: Publish release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
          PRERELEASE: ${{ inputs.prerelease }}
        run: |
          $flags = @('--target', $env:GITHUB_SHA, '--title', "Factory Seat Companion $env:VERSION", '--generate-notes')
          if ($env:PRERELEASE -eq 'true') { $flags += '--prerelease' }
          gh release create "v$env:VERSION" "artifacts/FactorySeatCompanion-Setup-$env:VERSION.exe" "artifacts/FactorySeatCompanion-$env:VERSION.zip" @flags
